services:

  # REDIS: Streaming URL Cache
  redis:
    image: redis:8.10-alpine
    container_name: streammesh-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - streammesh-network

  # PostgreSQL: Movie Catalog Storage
  postgres:
    image: postgres:17
    container_name: streammesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: streammesh
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d streammesh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - streammesh-network


  # KAFKA: Event Streaming (KRAFT Mode)
  kafka:
    image: apache/kafka:4.3.2
    container_name: streammesh-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - streammesh-network

volumes:
  postgres-data:
  kafka-data:

networks:
  streammesh-network:
    driver: bridge