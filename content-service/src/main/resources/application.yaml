spring:
  application:
    name: content-service

  datasource:
    url: jdbc:postgreql://localhost:5432/content_db
    username: postgres
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        # You usually do not need to set hibernate.dialect manually—Hibernate automatically detects it from your JDBC connection.
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info